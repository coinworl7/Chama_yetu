<script src="render.js"></script>
<script>
  (function () {
    "use strict";

    var doc = document.getElementById("doc");
    var hint = document.getElementById("hint");
    var current = null;

    function draw(data) {
      current = data;
      doc.innerHTML = ChamaStatement.render(data);
      return current;
    }

    function setHint(text) {
      hint.textContent = text;
    }

    // 1. Draw the payload that lives in this file.
    try {
      draw(JSON.parse(document.getElementById("payload").textContent));
    } catch (err) {
      doc.innerHTML = "<div class='issues issues-error'><b>Could not read the payload.</b><ul><li>" +
        String(err.message).replace(/[<>&]/g, "") + "</li></ul></div>";
    }

    // 2. Replace the data from a JSON file, without editing this HTML.
    document.getElementById("load").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          draw(JSON.parse(String(reader.result)));
          setHint("Loaded " + file.name + ". Check the reconciliation line.");
        } catch (err) {
          setHint("Could not read " + file.name + ": " + err.message);
        }
      };
      reader.readAsText(file);
    });

    // 3. Copy the short version for WhatsApp.
    window.copyWhatsApp = function () {
      if (!current) return;
      var text = ChamaStatement.toWhatsApp(current);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { setHint("Copied. Paste into the group's WhatsApp."); },
          function () { window.prompt("Copy this:", text); }
        );
      } else {
        window.prompt("Copy this:", text);
      }
    };

    // Exposed for testing and for the future app.
    window.drawStatement = draw;
    window.chamaStatement = function () { return current; };
  })();
</script>
